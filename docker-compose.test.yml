# Independent project, ephemeral database, no host ports or production data.
name: trafficbet-tests
services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: trafficbet_tests
      POSTGRES_USER: trafficbet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    tmpfs:
      - /var/lib/postgresql/data
    networks: [tests]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U trafficbet -d trafficbet_tests"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://trafficbet:${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}@postgres:5432/trafficbet_tests?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tests]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
networks:
  tests:
    internal: true
