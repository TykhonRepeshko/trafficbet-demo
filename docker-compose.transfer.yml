# Controlled rehearsal only. A newly named project/database, loopback ports and
# run-owned volumes; never the normal application's postgres_data volume.
services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: trafficbet
      POSTGRES_PASSWORD: ${TRANSFER_POSTGRES_PASSWORD:?Use scripts/verify-docker-transfer.ps1}
    ports: ["127.0.0.1:55434:5432"]
    volumes: [transfer_postgres:/var/lib/postgresql/data]
    # Docker's internal bridge suppresses published ports. This second private
    # bridge permits only the explicit loopback restore port during rehearsal.
    networks: [database, restore_access]
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?Use scripts/verify-docker-transfer.ps1}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U trafficbet -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
  migrate:
    build:
      context: ./backend
    entrypoint: [/app/migrate]
    environment:
      DATABASE_URL: postgres://trafficbet:${TRANSFER_POSTGRES_PASSWORD:?}@postgres:5432/${TRANSFER_DATABASE:?}?sslmode=disable
      RUNTIME_DATABASE_USER: trafficbet_runtime
      RUNTIME_DATABASE_PASSWORD: ${TRANSFER_RUNTIME_PASSWORD:?}
    networks: [database]
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
  backend:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: development
      DATABASE_URL: postgres://trafficbet_runtime:${TRANSFER_RUNTIME_PASSWORD:?}@postgres:5432/${TRANSFER_DATABASE:?}?sslmode=disable
      RUN_DATABASE_MIGRATIONS: "false"
      WORKER_TOKEN: ${TRANSFER_WORKER_TOKEN:?}
      FRONTEND_ORIGIN: http://localhost:4202
      COOKIE_SECURE: "false"
      SEED_DEMO_DATA: "false"
      SOURCE_OBSERVER_ENABLED: "false"
      EVIDENCE_DIRECTORY: /app/evidence
      VIDEO_DECODER_PATH: /usr/bin/ffmpeg
      MEDIA_ALLOWED_HOSTS: kamera.vegvesen.no,wzmedia.dot.ca.gov,cwwp2.dot.ca.gov
    volumes: [transfer_evidence:/app/evidence]
    networks: [web, database]
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /app/api, healthcheck]
      interval: 2s
      timeout: 5s
      retries: 30
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
  frontend:
    build:
      context: ./frontend
    ports: ["127.0.0.1:4202:8080"]
    networks: [web]
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 2s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
networks:
  restore_access:
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
  web:
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
  database:
    internal: true
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
volumes:
  transfer_postgres:
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
  transfer_evidence:
    labels:
      trafficbet.transfer-run: ${TRANSFER_RUN_ID:?}
