worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Exclude request paths/queries, account searches, cookies and source handles.
  log_format safe_request '$request_method $status $body_bytes_sent $request_time $sent_http_x_request_id';
  access_log /dev/stdout safe_request;
  server_tokens off;
  sendfile on;
  client_max_body_size 64k;
  client_body_timeout 10s;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=media:2m rate=10r/s;
  limit_req_status 429;

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://rtsp.me/embed/5tYtr3zD/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control no-store always;

    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    location ~ ^/api/auth/(login|register)$ {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Access-Control-Allow-Origin;
    }

    location /api/media/ {
      limit_req zone=media burst=30 nodelay;
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Cookie "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_buffering off;
      proxy_hide_header Access-Control-Allow-Origin;
    }

    location ~ ^/api/admin/preparation/[1-9][0-9]*/references$ {
      client_max_body_size 1m;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_hide_header Access-Control-Allow-Origin;
    }

    location /api/ {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_hide_header Access-Control-Allow-Origin;
    }

    # Legacy placeholder routes are not arbitrary upstream proxies.
    location /media/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
